<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="movies.css">
</head>

<body>
    <header>
        <h1>Movie night</h1>
        <nav>
            <button class="nav-btn">Popular</button>
            <button class="nav-btn">Top Rated</button>
            <button class="nav-btn">Upcoming</button>
        </nav>
    </header>
    <main>
        <section id="featured">
            <h2>Featured tonight</h2>
            <div class="loader"></div>
        </section>
        <section class="movie-grid">
            <div class="card">
                <div class="poster" style="background-image: url('https://static.wikia.nocookie.net/fastandfurious/images/0/04/The_Fast_and_the_Furious_%28DVD_Cover%29.jpeg/revision/latest?cb=20150501043627');"></div>
                <h3>Fast & furious</h3>
                <p class="rating high">8.1</p>
                <p class="rating low">5</p>
            </div>
            <div class="card">
                <div class="poster" style="background-image: url('https://m.media-amazon.com/images/M/MV5BYWUzNzZkNzUtNDdiYy00Nzk5LTgxMmItNTk0MjRjNjdjNDA0XkEyXkFqcGc@._V1_FMjpg_UX1000_.jpg');"></div>
                <h3>Full metal jacket</h3>
                <p class="rating high">8.4</p>
                <p class="rating low">5.5</p>
            </div>
            <div class="card">
                <div class="poster" style="background-image: url('https://static.wikia.nocookie.net/transformers/images/8/82/Transformers_2007_poster_official.jpg/revision/latest?cb=20161214173545');"></div>
                <h3>Transformers</h3>
                <p class="rating high">8.8</p>
                <p class="rating low">6</p>
            </div>
            <div class="card">
                <div class="poster"
                    style="background-image: url('https://m.media-amazon.com/images/S/pv-target-images/e58c803d1a924c61dde4a8abca71b6dcc133ee45919ea9404d350844a1326aa0.jpg');">
                </div>
                <h3>shrek</h3>
                <p class="rating high">9.0</p>
                <p class="rating low">3.4</p>
            </div>

        </section>
    </main>
</body>

</html>
